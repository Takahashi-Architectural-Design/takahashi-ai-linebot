services:
  - type: web
    name: takahashi-ai-linebot
    runtime: python
    buildCommand: pip install -r requirements.txt
    # bind / workers / threads / timeout は gunicorn.conf.py 側で設定
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
